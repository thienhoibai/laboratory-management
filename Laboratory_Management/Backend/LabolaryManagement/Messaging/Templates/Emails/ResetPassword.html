<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reset your password</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; color:#222; }
    .container { max-width:600px; margin:0 auto; padding:24px; border:1px solid #eee; }
    .btn { display:inline-block; padding:10px 16px; background:#0d6efd; color:#fff; text-decoration:none; border-radius:4px; }
    .muted { color:#666; font-size:12px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Password reset request</h2>
    <p>Hello {{Username}},</p>
    <p>You requested to reset your password. Click the button below to continue (the link expires in {{ExpireMinutes}} minutes):</p>
    <p><a class="btn" href="{{Link}}" target="_blank" rel="noopener">Reset password</a></p>
    <p class="muted">If you did not make this request, you can ignore this email.</p>
  </div>
</body>
</html>
