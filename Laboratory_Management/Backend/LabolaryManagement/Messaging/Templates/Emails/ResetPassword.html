<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Đặt lại mật khẩu</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; color:#222; }
    .container { max-width:600px; margin:0 auto; padding:24px; border:1px solid #eee; }
    .btn { display:inline-block; padding:10px 16px; background:#0d6efd; color:#eee; text-decoration:none; border-radius:4px; }
    .muted { color:#666; font-size:12px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Yêu cầu đặt lại mật khẩu</h2>
    <p>Xin chào {{Username}},</p>
    <p>Bạn đã yêu cầu đặt lại mật khẩu. Nhấn vào nút bên dưới để tiếp tục (liên kết sẽ hết hạn sau {{ExpireMinutes}} phút):</p>
    <p><a class="btn" href="{{Link}}" target="_blank" rel="noopener">Đặt lại mật khẩu</a></p>
    <p class="muted">Nếu bạn không thực hiện yêu cầu này, vui lòng bỏ qua email.</p>
  </div>
</body>
</html>
