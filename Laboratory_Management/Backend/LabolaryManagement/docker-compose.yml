services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports: ["5672:5672","15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  iam.api:
    build:
      context: .
      dockerfile: iam.Dockerfile
    container_name: iam.api
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      ConnectionStrings__LabIAM: "Server=host.docker.internal,1433;Database=LabIAM;User Id=sa;Password=12345;TrustServerCertificate=True;Encrypt=False"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__User: "lab"
      RabbitMQ__Pass: "lab123"
      # JWT config (must match patient.api)
      Jwt__Issuer: "lab-iam"
      Jwt__Audience: "lab.api"
      Jwt__SigningKey: "Jx6n2QvB5pTf8Kz3Wm9aS4Ld7Yh0Nr2Xu8Cj5Pk1Vg3Mz7Rb0Hq4Tn6Wy8Le2"
      Jwt__AccessTokenMinutes: "60"
      Jwt__RefreshTokenDays: "14"

      Auth__Google__ClientId: "834593887103-av11ov3n9l5pp160ekmr68e844nq2kg2.apps.googleusercontent.com"

    depends_on:
      rabbitmq:
        condition: service_healthy
    ports: ["5001:5001"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  patient.api:
    build:
      context: .
      dockerfile: patient.Dockerfile
    container_name: patient.api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__PatientService4: "Server=host.docker.internal,1433;Database=PatientService4;User Id=sa;Password=12345;TrustServerCertificate=True;Encrypt=False"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__User: "lab"
      RabbitMQ__Pass: "lab123"
      # JWT config (must match iam.api)
      Jwt__Issuer: "lab-iam"
      Jwt__Audience: "lab.api"
      Jwt__SigningKey: "Jx6n2QvB5pTf8Kz3Wm9aS4Ld7Yh0Nr2Xu8Cj5Pk1Vg3Mz7Rb0Hq4Tn6Wy8Le2"
      # PII encryption keys (primary first, then legacy). Keep them secret.
      PATIENT_PII_KEYS: |
        FES03/bBdxXAmpgtDTccC15qDWd112gVLcksrZEib98=
        8wCAUQo+Bggcq7suyJ2io37vmFLjOORzl7RMbhmipR0=
        W2mPvA+pi08SJGTUV43coZxqWVNP3guFg0puMHW4jdc=
      Grpc__IamUrl: "http://iam.api:5001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports: ["5002:5002"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api.gateway:
    build:
      context: .
      dockerfile: gateway.Dockerfile
    container_name: api.gateway
    depends_on:
      - iam.api
      - patient.api
      - blogservice.api
    ports: ["8080:8080"]

  notify.api:
    build:
      context: .
      dockerfile: deployments/docker/Notify.Dockerfile
    container_name: notify.api
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5601"
      ConnectionStrings__Notify: "Server=host.docker.internal,1433;Database=notify;User Id=sa;Password=12345;TrustServerCertificate=True;Encrypt=False"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__User: "lab"
      RabbitMQ__Pass: "lab123"
      # SMTP settings consumed by Messaging.Email.SmtpEmailSender (Email:Smtp:*)
      Email__Smtp__Host: "smtp.gmail.com"
      Email__Smtp__Port: "587"
      Email__Smtp__UseStartTls: "true"
      Email__Smtp__User: "managermentlabolary@gmail.com"
      Email__Smtp__Password: "qivyvznissngdvhn"
      Email__Smtp__From: "managermentlabolary@gmail.com"
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports: ["5601:5601"]

  testorder.api:
    build:
     context: .
     dockerfile: testorder.Dockerfile
    container_name: testorder.api
    environment:
     ASPNETCORE_ENVIRONMENT: "Docker"
     TZ: Asia/Ho_Chi_Minh   # <== thêm cái nàyd
     ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=TestOrderDB;User Id=sa;Password=12345;TrustServerCertificate=True;Encrypt=False"
     RabbitMQ__Host: "rabbitmq"
     RabbitMQ__User: "lab"
     RabbitMQ__Pass: "lab123"
      # JWT config (must match iam.api)
     Jwt__Issuer: "lab-iam"
     Jwt__Audience: "lab.api"
     Jwt__SigningKey: "Jx6n2QvB5pTf8Kz3Wm9aS4Ld7Yh0Nr2Xu8Cj5Pk1Vg3Mz7Rb0Hq4Tn6Wy8Le2"
    depends_on:
     rabbitmq:
       condition: service_healthy
    ports:
     - "5003:5003"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  blogservice.api:
    build:
      context: .
      dockerfile: deployments/docker/BlogService.Dockerfile
    container_name: blogservice.api
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=BlogServiceDB;User Id=sa;Password=12345;TrustServerCertificate=True;Encrypt=False"
      # JWT config (must match iam.api)
      Jwt__Issuer: "lab-iam"
      Jwt__Audience: "lab.api"
      Jwt__SigningKey: "Jx6n2QvB5pTf8Kz3Wm9aS4Ld7Yh0Nr2Xu8Cj5Pk1Vg3Mz7Rb0Hq4Tn6Wy8Le2"
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports: ["5004:5004"]
    volumes: 
      - ./BlogService.Presentation/Images:/app/Images 
    extra_hosts:
      - "host.docker.internal:host-gateway"

  instrument.api:
    build:  
      context: .
      dockerfile: instrument.Dockerfile
    container_name: instrument.api
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      ConnectionStrings__InstrumentDb: "Server=host.docker.internal,1433;Database=InstrumentDB;User Id=sa;Password=12345;TrustServerCertificate=True;Encrypt=False"
      TestOrderBaseUrl: "http://testorder.api:5003"
      # JWT config (must match iam.api)
      Jwt__Issuer: "lab-iam"
      Jwt__Audience: "lab.api"
      Jwt__SigningKey: "Jx6n2QvB5pTf8Kz3Wm9aS4Ld7Yh0Nr2Xu8Cj5Pk1Vg3Mz7Rb0Hq4Tn6Wy8Le2"
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports: ["5008:5008"]
    volumes: 
      - ./Instrument.Presentation/Images:/app/Images  # ✅ Bind mount - file sẽ sync với máy local
    extra_hosts:
      - "host.docker.internal:host-gateway"
