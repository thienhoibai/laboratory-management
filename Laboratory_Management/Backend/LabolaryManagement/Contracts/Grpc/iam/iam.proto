syntax = "proto3";

option csharp_namespace = "Iam.Grpc";

package iam;

// Simple IAM user contract for cross-service gRPC calls
service UserService {
  // Get a user by id
  rpc GetUser (GetUserRequest) returns (GetUserReply);
}

message GetUserRequest {
  string userId = 1;
}

message GetUserReply {
  string userId = 1;
  string fullName = 2;
  string email = 3;
}
